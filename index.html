<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Delfos: las máximas de la antigua Grecia en un póster oracular.">
    <meta name="author" content="gonzalo123">
    <meta name="theme-color" content="#cf5426">
    <meta name="color-scheme" content="dark">
    <title>ΔΕΛΦΟΙ — Conócete a ti mismo</title>

    <style>
        :root {
            --ink: #100f0d;
            --clay: #cf5426;
            --clay-dark: #7d2b14;
            --bone: #eee3c8;
            --stone: #b9ad92;
            --gold: #efb43d;
            --line: 2px;
            --header-h: 62px;
            --footer-h: 40px;
            --ease: cubic-bezier(.16, 1, .3, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        * {
            margin: 0;
        }

        html {
            background: var(--ink);
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            background: var(--ink);
            color: var(--bone);
            font-family: Arial, Helvetica, sans-serif;
            text-rendering: geometricPrecision;
        }

        a {
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: var(--gold);
            color: var(--ink);
        }

        .skip-link {
            position: fixed;
            top: .75rem;
            left: .75rem;
            z-index: 100;
            padding: .75rem 1rem;
            background: var(--bone);
            color: var(--ink);
            font-weight: 900;
            transform: translateY(-160%);
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        .grain {
            position: fixed;
            inset: -35%;
            z-index: 80;
            pointer-events: none;
            opacity: .07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
            animation: grain-shift .24s steps(2) infinite;
        }

        .page {
            height: 100vh;
            height: 100svh;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-rows: var(--header-h) minmax(0, 1fr) var(--footer-h);
            overflow: hidden;
            isolation: isolate;
        }

        .masthead {
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto;
            align-items: stretch;
            border-bottom: var(--line) solid var(--bone);
            background: var(--ink);
            text-transform: uppercase;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: 0 1.15rem;
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .16em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            aspect-ratio: 1;
            place-items: center;
            border: var(--line) solid var(--bone);
            background: var(--clay);
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.4rem;
            line-height: 1;
            transition: transform .35s var(--ease), background .2s;
        }

        .brand:hover .brand-mark {
            transform: rotate(-7deg);
            background: var(--gold);
        }

        .primary-nav {
            display: flex;
            align-items: stretch;
            border-left: var(--line) solid var(--bone);
        }

        .primary-nav a {
            display: flex;
            align-items: center;
            padding: 0 1.15rem;
            border-right: 1px solid rgba(238, 227, 200, .3);
            font-family: 'Courier New', monospace;
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-decoration: none;
            white-space: nowrap;
            transition: background .18s, color .18s;
        }

        .primary-nav a:last-child {
            border-right: 0;
        }

        .primary-nav a:hover,
        .primary-nav a:focus-visible {
            background: var(--bone);
            color: var(--ink);
            outline: 0;
        }

        .poster {
            min-height: 0;
            display: grid;
            grid-template-columns: 66px minmax(0, 1fr);
        }

        .axis-rail {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: var(--line) solid var(--ink);
            background: var(--clay);
            color: var(--ink);
        }

        .axis-rail p {
            display: flex;
            align-items: center;
            gap: 1.4rem;
            width: max-content;
            font-family: 'Courier New', monospace;
            font-size: .66rem;
            font-weight: 900;
            letter-spacing: .28em;
            text-transform: uppercase;
            transform: rotate(-90deg);
        }

        .axis-rail p::before,
        .axis-rail p::after {
            content: '';
            width: 56px;
            height: var(--line);
            background: currentColor;
        }

        .inscription-stage {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto auto;
            background: var(--bone);
            color: var(--ink);
        }

        .upper-stage {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(290px, .5fr);
        }

        .foundation {
            position: relative;
            min-height: 0;
            overflow: hidden;
            display: grid;
            place-items: center stretch;
            background:
                linear-gradient(90deg, transparent calc(38% - 1px), rgba(16, 15, 13, .13) 38%, transparent calc(38% + 1px)),
                var(--bone);
        }

        .primary-inscription {
            position: relative;
            z-index: 2;
            align-self: center;
            padding: clamp(1.2rem, 2.4vw, 2.7rem) clamp(1.15rem, 4.2vw, 4.8rem);
        }

        .primary-greek {
            max-width: 16ch;
            color: var(--clay);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.7rem, 3.5vw, 4.25rem);
            font-weight: 700;
            letter-spacing: -.035em;
            line-height: .9;
            text-transform: uppercase;
        }

        .primary-inscription h1 {
            max-width: 9ch;
            margin-top: clamp(.65rem, 1.6vh, 1.3rem);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: clamp(3.2rem, 5.8vw, 7rem);
            font-weight: 900;
            letter-spacing: -.045em;
            line-height: .75;
            text-transform: uppercase;
        }

        .primary-inscription h1 span {
            display: block;
        }

        .primary-inscription h1 span:last-child {
            margin-left: .43em;
        }

        .epsilon-relic {
            position: absolute;
            right: clamp(1rem, 2vw, 2rem);
            bottom: clamp(1.25rem, 3vh, 2rem);
            z-index: 1;
            display: grid;
            justify-items: center;
            color: var(--ink);
            opacity: .12;
            transform: rotate(5deg);
        }

        .epsilon-relic strong {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(2.4rem, 4vw, 4.5rem);
            font-weight: 400;
            line-height: .85;
        }

        .secondary-inscription {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 1.5rem;
            min-height: 92px;
            border-top: var(--line) solid var(--ink);
            background: var(--gold);
        }

        .secondary-copy {
            padding: .85rem 0 .85rem clamp(1.35rem, 3vw, 3rem);
        }

        .secondary-copy h2 {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: clamp(2rem, 3.3vw, 4rem);
            font-weight: 900;
            letter-spacing: -.025em;
            line-height: .84;
            text-transform: uppercase;
        }

        .secondary-greek {
            padding-right: clamp(1rem, 2vw, 2rem);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(.85rem, 1.3vw, 1.35rem);
            font-weight: 700;
            letter-spacing: .08em;
            text-align: right;
            text-transform: uppercase;
        }

        .oracle-panel {
            position: relative;
            z-index: 4;
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr);
            min-height: clamp(150px, 21vh, 212px);
            border-top: var(--line) solid var(--bone);
            background: var(--ink);
            color: var(--bone);
        }

        .oracle-label {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-right: 1px solid rgba(238, 227, 200, .3);
            padding: 1rem .8rem;
            background: var(--clay);
            color: var(--ink);
            font-family: 'Courier New', monospace;
            font-size: .58rem;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .oracle-number {
            font-size: 1.3rem;
            letter-spacing: -.08em;
        }

        .oracle-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.15rem clamp(1.2rem, 3vw, 3rem);
        }

        #fact_text_greek {
            max-width: 25ch;
            color: var(--clay);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.55rem, 2.7vw, 3.4rem);
            font-weight: 700;
            line-height: .98;
            text-transform: uppercase;
        }

        #fact_text {
            max-width: 54ch;
            margin-top: .7rem;
            font-size: clamp(.76rem, .94vw, .96rem);
            font-weight: 700;
            letter-spacing: .04em;
            line-height: 1.35;
            text-transform: uppercase;
        }

        .oracle-progress {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 72px;
            height: 4px;
            overflow: hidden;
            background: rgba(238, 227, 200, .12);
        }

        .oracle-progress span {
            display: block;
            width: 100%;
            height: 100%;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: left;
        }

        .oracle-progress span.running {
            animation: oracle-timer 16s linear forwards;
        }

        .is-scrambling #fact_text,
        .is-scrambling #fact_text_greek {
            text-shadow: 2px 0 0 rgba(207, 84, 38, .22);
        }

        .ceramic-panel {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border-left: var(--line) solid var(--ink);
            background: var(--clay-dark);
        }

        .ceramic-layer {
            position: absolute;
            inset: 0;
            background-position: center;
            background-size: cover;
            filter: grayscale(1) contrast(1.3) brightness(.67);
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 1.2s ease, transform 18s linear;
        }

        .ceramic-layer.active {
            opacity: 1;
            transform: scale(1);
        }

        .ceramic-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                linear-gradient(180deg, rgba(16, 15, 13, .02), rgba(16, 15, 13, .77)),
                var(--clay);
            mix-blend-mode: multiply;
        }

        .ceramic-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            border: 13px solid transparent;
            border-image: repeating-linear-gradient(90deg, var(--bone) 0 8px, transparent 8px 14px, var(--bone) 14px 18px, transparent 18px 28px) 13;
            opacity: .26;
        }

        .site-footer {
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: 1fr minmax(240px, 38vw) 1fr;
            align-items: stretch;
            border-top: var(--line) solid var(--bone);
            background: var(--ink);
            font-family: 'Courier New', monospace;
            font-size: .58rem;
            font-weight: 700;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .site-footer p {
            display: flex;
            align-items: center;
            padding-inline: 1rem;
        }

        .site-footer p:last-child {
            justify-content: flex-end;
            text-align: right;
        }

        .footer-key {
            border-inline: var(--line) solid var(--bone);
            background:
                linear-gradient(135deg, var(--clay) 25%, transparent 25%) -9px 0/18px 18px,
                linear-gradient(225deg, var(--clay) 25%, transparent 25%) -9px 0/18px 18px,
                linear-gradient(315deg, var(--clay) 25%, transparent 25%) 0 0/18px 18px,
                linear-gradient(45deg, var(--clay) 25%, var(--ink) 25%) 0 0/18px 18px;
        }

        @keyframes grain-shift {
            0% { transform: translate(0, 0); }
            25% { transform: translate(2%, -3%); }
            50% { transform: translate(-3%, 2%); }
            75% { transform: translate(3%, 3%); }
            100% { transform: translate(-2%, -2%); }
        }

        @keyframes oracle-timer {
            to { transform: scaleX(1); }
        }

        @media (max-width: 1080px) {
            .brand-text {
                display: none;
            }

            .poster {
                grid-template-columns: 52px minmax(0, 1fr);
            }

            .upper-stage {
                grid-template-columns: minmax(0, 1fr) 250px;
            }

            .primary-nav a {
                padding-inline: .8rem;
            }

        }

        @media (max-width: 760px) {
            :root {
                --header-h: 56px;
                --footer-h: 36px;
            }

            .page {
                display: block;
                height: auto;
                min-height: 100svh;
                overflow: visible;
            }

            .masthead {
                position: sticky;
                top: 0;
                grid-template-columns: auto minmax(0, 1fr);
                height: var(--header-h);
            }

            .brand {
                padding-inline: .7rem;
            }

            .primary-nav {
                min-width: 0;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .primary-nav::-webkit-scrollbar {
                display: none;
            }

            .primary-nav a {
                flex: 0 0 auto;
                padding-inline: .65rem;
                font-size: .54rem;
            }

            .poster {
                display: block;
            }

            .axis-rail {
                display: none;
            }

            .inscription-stage {
                min-height: calc(100svh - var(--header-h));
            }

            .upper-stage {
                display: block;
            }

            .foundation {
                min-height: 590px;
            }

            .primary-inscription {
                padding: 1.5rem 1.1rem;
            }

            .primary-greek {
                font-size: clamp(1.8rem, 7.5vw, 2.6rem);
            }

            .primary-inscription h1 {
                font-size: clamp(3.4rem, 16vw, 5.2rem);
            }

            .epsilon-relic {
                right: .9rem;
                bottom: 1.1rem;
            }

            .epsilon-relic strong {
                font-size: 3rem;
            }

            .secondary-inscription {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .secondary-greek {
                padding: 0 1rem .75rem;
                text-align: left;
            }

            .secondary-copy {
                padding: .8rem 1rem .1rem;
            }

            .secondary-copy h2 {
                font-size: 2.25rem;
            }

            .oracle-panel {
                grid-template-columns: 56px minmax(0, 1fr);
                min-height: 205px;
            }

            .oracle-label {
                padding: .8rem .5rem;
            }

            .oracle-label span:first-child {
                writing-mode: vertical-rl;
                transform: rotate(180deg);
            }

            .oracle-copy {
                padding: 1.2rem 1rem;
            }

            #fact_text_greek {
                font-size: clamp(1.5rem, 7.4vw, 2.3rem);
            }

            .oracle-progress {
                right: 0;
                left: 56px;
            }

            .ceramic-panel {
                display: none;
            }

            .site-footer {
                height: var(--footer-h);
                grid-template-columns: minmax(140px, 1fr) 1fr;
            }

            .site-footer p:first-child {
                display: none;
            }

            .footer-key {
                border-left: 0;
            }
        }

        @media (max-height: 710px) and (min-width: 761px) {
            .primary-inscription {
                padding-block: 1rem;
            }

            .primary-inscription h1 {
                font-size: clamp(4.2rem, 7vw, 7rem);
            }

            .secondary-inscription {
                min-height: 76px;
            }

            .oracle-panel {
                min-height: 142px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }

            .grain {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#oraculo">Ir a la máxima actual</a>
    <div class="grain" aria-hidden="true"></div>

    <div class="page">
        <header class="masthead">
            <a class="brand" href="./" aria-label="Oráculo de Delfos, página de inicio">
                <span class="brand-mark" aria-hidden="true">Δ</span>
                <span class="brand-text">Oráculo de Delfos</span>
            </a>

            <nav class="primary-nav" aria-label="Proyectos sobre Grecia">
                <a href="https://gonzalo123.github.io/grecia/Delfos/">Delfos ↗</a>
                <a href="https://gonzalo123.github.io/alfabeto/">Alfabeto ↗</a>
                <a href="https://gonzalo123.github.io/palabras/">Λέξεις ↗</a>
                <a href="https://twitter.com/gonzalo123">@gonzalo123 ↗</a>
            </nav>
        </header>

        <main class="poster">
            <aside class="axis-rail" aria-hidden="true">
                <p>ΔΕΛΦΟΙ</p>
            </aside>

            <section class="inscription-stage" aria-labelledby="page-title">
                <div class="upper-stage">
                    <div class="foundation">
                        <article class="primary-inscription">
                            <p class="primary-greek" lang="grc">ΓΝΩΘΙ ΣΑΥΤΟΝ</p>
                            <h1 id="page-title">
                                <span>Conócete</span>
                                <span>a ti mismo</span>
                            </h1>
                        </article>

                        <div class="epsilon-relic" aria-label="La misteriosa E de Delfos, cuyo significado se desconoce">
                            <strong aria-hidden="true">Ε</strong>
                        </div>
                    </div>

                    <aside class="ceramic-panel" aria-label="Cerámica griega de figuras negras">
                        <div class="ceramic-layer active" id="ceramic-a" aria-hidden="true"></div>
                        <div class="ceramic-layer" id="ceramic-b" aria-hidden="true"></div>
                    </aside>
                </div>

                <article class="secondary-inscription" aria-labelledby="second-maxim">
                    <div class="secondary-copy">
                        <h2 id="second-maxim">Nada en exceso</h2>
                    </div>
                    <p class="secondary-greek" lang="grc">ΜΗΔΕΝ ΑΓΑΝ</p>
                </article>

                <article class="oracle-panel" id="oraculo" aria-labelledby="fact_text_greek">
                    <div class="oracle-label" aria-hidden="true">
                        <span class="oracle-number" id="oracle-number">001</span>
                    </div>

                    <div class="oracle-copy" aria-live="polite" aria-atomic="true">
                        <h2 id="fact_text_greek" lang="grc">ΣΟΦΙΑΝ ΖΗΤΕΙ</h2>
                        <p id="fact_text">Busca la sabiduría</p>
                    </div>

                    <div class="oracle-progress" aria-hidden="true"><span id="oracle-progress"></span></div>
                </article>
            </section>
        </main>

        <footer class="site-footer">
            <p>ΓΝΩΘΙ ΣΑΥΤΟΝ · ΜΗΔΕΝ ΑΓΑΝ</p>
            <div class="footer-key" aria-hidden="true"></div>
            <p>38.4824° N · 22.5010° E</p>
        </footer>
    </div>

    <script src="./app.js"></script>
</body>
</html>
